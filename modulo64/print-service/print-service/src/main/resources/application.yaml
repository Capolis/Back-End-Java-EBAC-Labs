server:
  port: 8083

spring:
  application:
    name: print-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: print-group # Identificador isolado para garantir a entrega duplicada da arquitetura
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*" # OBRIGATÓRIO PARA CONSUMIR JSON

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans