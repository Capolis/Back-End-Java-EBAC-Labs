# Database connection settings (apontando para o service 'mysql-db' do docker-compose)
spring.datasource.url=jdbc:mysql://mysql-db:3306/name_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpass

# Explicitly setting the MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Create/update tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true